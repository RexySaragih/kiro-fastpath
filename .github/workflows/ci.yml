name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install
      - run: npm approve-scripts better-sqlite3 || true
      - run: npm rebuild better-sqlite3
      - run: npm run build
      - run: npm test
      - run: npm run test:connections
      - run: npm run eval
      - run: npm run eval:office
      - run: npm run audit:critical

  minilm-smoke:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - run: npm approve-scripts better-sqlite3 onnxruntime-node sharp protobufjs || true
      - run: npm rebuild better-sqlite3
      - run: npm run build
      - name: Warm MiniLM + treesitter
        run: |
          FASTPATH_EMBED=minilm FASTPATH_RERANK=on FASTPATH_PARSER=treesitter \
            node packages/cli/dist/index.js warm
      - name: Index fixture with MiniLM
        run: |
          TMP=$(mktemp -d)
          cp -R fixtures/sample-src "$TMP/src"
          FASTPATH_EMBED=minilm FASTPATH_RERANK=on FASTPATH_PARSER=treesitter \
            node packages/cli/dist/index.js init "$TMP"
          FASTPATH_EMBED=minilm FASTPATH_RERANK=on FASTPATH_PARSER=treesitter \
            node packages/cli/dist/index.js index "$TMP"
          FASTPATH_EMBED=minilm FASTPATH_RERANK=on FASTPATH_PARSER=treesitter \
            FASTPATH_ALLOW_HASH=0 \
            node packages/cli/dist/index.js doctor "$TMP" --json | tee /tmp/doctor.json
          node -e "
            const d=require('/tmp/doctor.json');
            if(!d.ready) { console.error(d); process.exit(1); }
            if(d.embedBackend!=='minilm') { console.error('expected minilm', d); process.exit(1); }
            console.log('MiniLM doctor OK');
          "
