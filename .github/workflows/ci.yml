name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - run: npm approve-scripts better-sqlite3 || true
      - run: npm rebuild better-sqlite3
      - run: npm run build
      - run: npm test
      - run: npm run test:connections
      - run: npm run eval
